<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#063d22" />
  <title>Molduras</title>

  <meta name="title" content="Molduras" />
  <meta name="description" content="Gere seu flyer personalizado para você." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://umbulabs.github.io/molduras/" />
  <meta property="og:title" content="Molduras" />
  <meta property="og:description" content="Gere seu flyer personalizado para você." />
  <meta property="og:image" itemprop="image"
    content="https://umbulabs.github.io/molduras/assets/imgEscolhaImagem.png?v=1" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://umbulabs.github.io/molduras/" />
  <meta property="twitter:title" content="Molduras" />
  <meta property="twitter:description" content="Gere seu flyer personalizado para você." />
  <meta property="twitter:image" content="https://umbulabs.github.io/molduras/assets/imgEscolhaImagem.png?v=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles/style.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-169842087-3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    var furl = window.location.href;
    gtag('config', 'UA-169842087-3', {
      'page_location': furl
    });
  </script>

  <script src="./dbMolduras.js"></script>
</head>

<body>
  <noscript>
    <div>Para continuar habilite o JavaScript</div>
  </noscript>

  <div class="container">

    <section id="inicio" class="tela inicio" aria-labelledby="titulo-inicio">
      <header class="inicio-cabecalho">
        <h1 id="titulo-inicio">Crie sua moldura</h1>
        <p>Escolha como quer personalizar e depois compartilhe com os amigos.</p>
      </header>

      <div class="escolhas">
        <button class="escolha" type="button" data-tipo="texto">
          <span class="escolha-previa">
            <img id="previa-texto" src="./imagens/moldura-texto-1.png" alt="" />
          </span>
          <span class="escolha-texto">
            <small>Coloque seu</small>
            <strong>Nome</strong>
          </span>
        </button>

        <button class="escolha" type="button" data-tipo="foto">
          <span class="escolha-previa">
            <img src="./imagens/moldura-imagem-menu.png" alt="" />
          </span>
          <span class="escolha-texto">
            <small>Coloque sua</small>
            <strong>Foto</strong>
          </span>
        </button>
      </div>
    </section>

    <main id="editor" class="tela editor hidden" aria-labelledby="titulo-editor">
      <div class="editor-topo">
        <button id="btnVoltar" class="btn-voltar" type="button" aria-label="Voltar ao início">←</button>
        <h1 id="titulo-editor">Coloque seu nome</h1>
      </div>

      <div class="previa">
        <canvas width="1080" height="1080"></canvas>
      </div>

      <div id="moldura-options" class="moldura-options" role="group" aria-label="Escolha a arte"></div>

      <div id="campo-texto" class="campo">
        <label for="texto-moldura">Seu nome</label>
        <input id="texto-moldura" type="text" maxlength="40" placeholder="Digite seu nome aqui"
          autocomplete="off" enterkeyhint="done" />
      </div>

      <div id="campo-foto" class="campo hidden">
        <button id="btnFoto" class="btn btn-foto" type="button">Escolher foto</button>
        <input id="foto-moldura" class="hidden" type="file" accept="image/*" aria-label="Escolher foto" />
      </div>

      <p id="aviso" class="aviso" role="status" aria-live="polite"></p>

      <div class="acoes">
        <button id="btnExportar" class="btn btn-exportar" type="button">Exportar</button>
        <button id="btnBaixar" class="btn btn-secundario" type="button">Baixar imagem</button>
      </div>
    </main>

    <footer>
      <a href="https://www.instagram.com/joaoeymard/" target="_blank" rel="noopener">
        <img src="./assets/instagram-logo.svg" alt="" />
        <span>Feito por: @joaoeymard</span>
      </a>
    </footer>
  </div>

  <script src="./scripts/main.js"></script>
</body>

</html>
