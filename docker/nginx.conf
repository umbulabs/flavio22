server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No ambiente local o projeto inteiro é montado; expõe apenas os arquivos do site.
    location ~ ^/(\.|docker/|Dockerfile|compose\.yaml|README\.md|AGENTS\.md|CNAME) {
        return 404;
    }

    location ~* \.(?:css|js|json|png|jpg|jpeg|svg|otf|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}

