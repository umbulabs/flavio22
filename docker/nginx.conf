server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|json|png|jpg|jpeg|svg|otf|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}

